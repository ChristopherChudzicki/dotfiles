# Shared by zsh and fish.
# Two-line prompt: directory + git + language versions, then a clean arrow.
# Replaces spaceship-prompt.

format = """
${custom.eks_writer}\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$line_break\
$character\
"""

# Warn — inline, first on the prompt line, only when active — that a kubeconfig
# grants read/write access to ODL EKS (incl. production). Shares one detector
# with Claude Code's statusline. Silent when read-only or absent.
[custom.eks_writer]
description = "ODL EKS read/write (writer) kubeconfig warning"
when = "$HOME/dev/dotfiles/bin/odl-eks-kubeconfig-mode"
command = "$HOME/dev/dotfiles/bin/odl-eks-kubeconfig-mode"
format = "[$output](bold red) "
shell = ["sh"]

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
deleted = "✘"
stashed = "$"
style = "bold red"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"
